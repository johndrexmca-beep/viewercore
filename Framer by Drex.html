<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Framer</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1b19;--mute:#6b6a65;--line:#e2e0d8;--acc:#4f46e5;--accink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15141a;--card:#1f1e26;--ink:#f1f0ee;--mute:#9b9aa5;--line:#34323f;--acc:#8b85ff;--accink:#14131a}}
:root[data-theme="dark"]{--bg:#15141a;--card:#1f1e26;--ink:#f1f0ee;--mute:#9b9aa5;--line:#34323f;--acc:#8b85ff;--accink:#14131a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:28px;margin:0;letter-spacing:-.02em}
.sub{color:var(--mute);margin:2px 0 16px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:800px){.grid{grid-template-columns:minmax(0,1fr) 380px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stage{display:flex;justify-content:center}
canvas{width:100%;max-width:520px;aspect-ratio:1;border-radius:12px;touch-action:none;cursor:grab;background:repeating-conic-gradient(#8883 0 25%,transparent 0 50%) 0 0/20px 20px}
canvas:active{cursor:grabbing}
.hint{text-align:center;color:var(--mute);font-size:13px;margin:8px 0 0}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:0 0 10px}
.card+.card{margin-top:14px}
label.r{display:grid;grid-template-columns:84px 1fr 44px;align-items:center;gap:8px;margin:6px 0;font-size:14px}
label.r span:last-child{color:var(--mute);text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
input[type=range]{width:100%;accent-color:var(--acc)}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--acc)}
.pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row>*{flex:1 1 auto}
.drop{display:block;text-align:center;border:2px dashed var(--line);border-radius:12px;padding:16px;color:var(--mute);cursor:pointer}
.drop.on{border-color:var(--acc);color:var(--ink)}
.frames{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.frames button{padding:8px 4px;font-size:13px}
.frames button.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px}
textarea{min-height:92px;resize:vertical}
input[type=color]{width:42px;height:36px;padding:0;border:1px solid var(--line);border-radius:8px;background:none}
.sp{display:flex;align-items:center;gap:8px;margin:8px 0}
.sp label{min-width:84px;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;font-size:14px}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <h1>Framer</h1>
  <p class="sub">Add a frame to your profile picture, then export it and share the caption.</p>
  <div class="grid">
    <div>
      <div class="card">
        <div class="stage"><canvas id="cv" width="1080" height="1080"></canvas></div>
        <p class="hint">Drag the photo to reposition it</p>
      </div>
    </div>
    <div>
      <div class="card">
        <h2>1 · Photo</h2>
        <label class="drop" id="drop"><input id="file" type="file" accept="image/*" hidden>Tap to upload or drop a photo here</label>
      </div>
      <div class="card">
        <h2>2 · Image controls</h2>
        <label class="r"><span>Zoom</span><input type="range" id="zoom" min="0.3" max="4" step="0.01" value="1"><span id="zoomV">1.0×</span></label>
        <label class="r"><span>Rotate</span><input type="range" id="rot" min="-180" max="180" step="1" value="0"><span id="rotV">0°</span></label>
        <label class="r"><span>Left/Right</span><input type="range" id="px" min="-540" max="540" step="1" value="0"><span id="pxV">0</span></label>
        <label class="r"><span>Up/Down</span><input type="range" id="py" min="-540" max="540" step="1" value="0"><span id="pyV">0</span></label>
        <label class="r"><span>Brightness</span><input type="range" id="br" min="-50" max="50" step="1" value="0"><span id="brV">0</span></label>
        <div class="row" style="margin-top:8px"><button id="flip">Flip</button><button id="rot90">Rotate 90°</button><button id="reset">Reset</button></div>
      </div>
      <div class="card">
        <h2>3 · Caption</h2>
        <textarea id="cap" style="min-height:300px">Let us come together to celebrate the 35th Anniversary of MCGI Sindalan! Join us as we celebrate the love and unity that continue to bind us together and to offer our thanksgiving to our God Almighty. 💙💛

📅 October 24, 2026 (Saturday) 
🕐 12:00 PM 
📍 MCGI Sindalan, 3rd Floor, GAMP Bldg., McArthur Highway, Sindalan, San Fernando, Pampanga

Let's show our support and be part of this special celebration through our DP Blast! 💙💛

#MCGISindalan35thAnniversary</textarea>
        <div class="row" style="margin-top:8px"><button id="copy">Copy caption</button></div>
      </div>
      <div class="card">
        <button class="pri" id="export" style="width:100%;padding:13px">Export as PNG</button>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>

  if(st.img){
    var w=st.img.naturalWidth,h=st.img.naturalHeight,base=Math.max(WIN.w/w,WIN.h/h)*st.zoom;
    ctx.save();ctx.translate(WIN.cx+st.x,WIN.cy+st.y);ctx.rotate(st.rot*Math.PI/180);ctx.scale(st.flip*base,base);
    ctx.drawImage(st.img,-w/2,-h/2);ctx.restore();
    if(st.br){ctx.fillStyle=st.br>0?'rgba(255,255,255,'+(st.br/100)+')':'rgba(0,0,0,'+(-st.br/100)+')';ctx.fillRect(0,0,S,S)}
  }else{
    ctx.fillStyle='#8a8880';ctx.font='600 44px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('Upload a photo',WIN.cx,WIN.cy)
  }
  ctx.drawImage(EV,0,0,S,S);
}
function bind(id,key,fmt){var el=$(id);el.oninput=function(){st[key]=parseFloat(el.value);$(id+'V').textContent=fmt(st[key]);draw()}}
bind('zoom','zoom',function(v){return v.toFixed(1)+'×'});
bind('rot','rot',function(v){return Math.round(v)+'°'});
bind('px','x',function(v){return Math.round(v)});
bind('py','y',function(v){return Math.round(v)});
bind('br','br',function(v){return Math.round(v)});
function sync(){['zoom','rot','px','py','br'].forEach(function(id){var k={px:'x',py:'y'}[id]||id;$(id).value=st[k];$(id).oninput&&$(id).oninput()})}
$('flip').onclick=function(){st.flip*=-1;draw()};
$('rot90').onclick=function(){st.rot=((st.rot+90+180)%360)-180;sync()};
$('reset').onclick=function(){st.zoom=1;st.rot=0;st.x=0;st.y=0;st.br=0;st.flip=1;sync()};

function load(f,cb){
  if(!f||!/^image\//.test(f.type)){toast('Please choose an image');return}
  var u=URL.createObjectURL(f),im=new Image();
  im.onload=function(){cb(im);URL.revokeObjectURL(u)};
  im.onerror=function(){toast('Could not read that image')};
  im.src=u;
}
$('file').onchange=function(e){load(e.target.files[0],function(im){st.img=im;st.x=0;st.y=0;sync();draw()})};
var dr=$('drop');
['dragenter','dragover'].forEach(function(n){dr.addEventListener(n,function(e){e.preventDefault();dr.classList.add('on')})});
['dragleave','drop'].forEach(function(n){dr.addEventListener(n,function(e){e.preventDefault();dr.classList.remove('on')})});
dr.addEventListener('drop',function(e){load(e.dataTransfer.files[0],function(im){st.img=im;st.x=0;st.y=0;sync();draw()})});

var drag=null;
cv.addEventListener('pointerdown',function(e){if(!st.img)return;cv.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,ox:st.x,oy:st.y}});
cv.addEventListener('pointermove',function(e){if(!drag)return;var k=S/cv.getBoundingClientRect().width;
  st.x=Math.max(-540,Math.min(540,drag.ox+(e.clientX-drag.x)*k));st.y=Math.max(-540,Math.min(540,drag.oy+(e.clientY-drag.y)*k));
  $('px').value=st.x;$('py').value=st.y;$('pxV').textContent=Math.round(st.x);$('pyV').textContent=Math.round(st.y);draw()});
['pointerup','pointercancel'].forEach(function(n){cv.addEventListener(n,function(){drag=null})});
cv.addEventListener('wheel',function(e){if(!st.img)return;e.preventDefault();st.zoom=Math.max(.3,Math.min(4,st.zoom*(e.deltaY<0?1.05:.95)));$('zoom').value=st.zoom;$('zoomV').textContent=st.zoom.toFixed(1)+'×';draw()},{passive:false});

$('copy').onclick=function(){
  var t=$('cap').value;
  function fb(){var a=$('cap');a.select();try{document.execCommand('copy');toast('Caption copied')}catch(e){toast('Press and hold to copy')}}
  try{navigator.clipboard.writeText(t).then(function(){toast('Caption copied')},fb)}catch(e){fb()}
};

$('export').onclick=function(){
  if(!st.img){toast('Upload a photo first');return}
  cv.toBlob(async function(b){
    if(!b){toast('Export failed');return}
    var dl=null;try{dl=await claude.use('downloads')}catch(e){}
    if(dl){try{await dl.save({filename:'framer-profile.png',data:b});toast('Saved')}catch(e){if(!e||e.code!=='declined')toast('Could not save')}}
    else{var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='framer-profile.png';document.body.appendChild(a);a.click();a.remove();toast('Exported')}
  },'image/png');
};
draw();
})();
</script>
</body>
</html>
